name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify exact tag (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release tag
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          git show-ref --verify --quiet "refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GNU Screen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y screen
      - name: Prefer Homebrew GNU Screen
        if: runner.os == 'macOS'
        run: brew install screen && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod verify
          sh -n install.sh scripts/build-release.sh
          git diff --check
          go test ./...
          go test -race ./...
          go vet ./...

  build:
    name: Build read-only release artifact
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify build checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          git show-ref --verify --quiet "refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release assets
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Verify built asset set and checksums
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="dist/${GITHUB_REF_NAME}"
          (
            cd "${asset_dir}"
            sha256sum --check SHA256SUMS
          )
          expected=$(printf '%s\n' \
            SHA256SUMS \
            install.sh \
            sclaude_darwin_amd64 \
            sclaude_darwin_arm64 \
            sclaude_linux_amd64 \
            sclaude_linux_arm64 | LC_ALL=C sort)
          actual=$(find "${asset_dir}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          test "${actual}" = "${expected}"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ github.ref_name }}/sclaude.spdx.json
      - name: Verify complete publication asset set
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="dist/${GITHUB_REF_NAME}"
          expected=$(printf '%s\n' \
            SHA256SUMS \
            install.sh \
            sclaude.spdx.json \
            sclaude_darwin_amd64 \
            sclaude_darwin_arm64 \
            sclaude_linux_amd64 \
            sclaude_linux_arm64 | LC_ALL=C sort)
          actual=$(find "${asset_dir}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          test "${actual}" = "${expected}"
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Attest and publish verified draft
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets
      - name: Create or validate draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_dir=release-assets
          tag=${GITHUB_REF_NAME}
          expected=(
            SHA256SUMS
            install.sh
            sclaude.spdx.json
            sclaude_darwin_amd64
            sclaude_darwin_arm64
            sclaude_linux_amd64
            sclaude_linux_arm64
          )
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "${RUNNER_TEMP}/expected-assets.txt"
          find "${asset_dir}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "${RUNNER_TEMP}/local-assets.txt"
          diff -u "${RUNNER_TEMP}/expected-assets.txt" "${RUNNER_TEMP}/local-assets.txt"
          (
            cd "${asset_dir}"
            sha256sum --check SHA256SUMS
            sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > "${RUNNER_TEMP}/local-assets.sha256"
          )

          existing_draft=false
          release_view_error="${RUNNER_TEMP}/release-view.err"
          if gh release view "${tag}" --json isDraft,isImmutable > "${RUNNER_TEMP}/release.json" 2>"${release_view_error}"; then
            test "$(jq -r .isDraft "${RUNNER_TEMP}/release.json")" = true || {
              echo "refusing to modify an already-published release: ${tag}" >&2
              exit 1
            }
            test "$(jq -r .isImmutable "${RUNNER_TEMP}/release.json")" = false || {
              echo "refusing to modify an immutable draft release: ${tag}" >&2
              exit 1
            }
            existing_draft=true
          elif grep -Fq "release not found" "${release_view_error}"; then
            gh release create "${tag}" \
              --draft \
              --generate-notes \
              --verify-tag \
              --target "${GITHUB_SHA}"
          else
            cat "${release_view_error}" >&2
            exit 1
          fi

          if [ "${existing_draft}" = false ]; then
            upload_paths=()
            for name in "${expected[@]}"; do
              upload_paths+=("${asset_dir}/${name}")
            done
            gh release upload "${tag}" "${upload_paths[@]}"
          fi

          remote_dir="${RUNNER_TEMP}/remote-release"
          rm -rf "${remote_dir}"
          mkdir -p "${remote_dir}"
          gh release download "${tag}" --dir "${remote_dir}"
          find "${remote_dir}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "${RUNNER_TEMP}/remote-assets.txt"
          diff -u "${RUNNER_TEMP}/expected-assets.txt" "${RUNNER_TEMP}/remote-assets.txt"
          (
            cd "${remote_dir}"
            sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > "${RUNNER_TEMP}/remote-assets.sha256"
          )
          cmp "${RUNNER_TEMP}/local-assets.sha256" "${RUNNER_TEMP}/remote-assets.sha256"
      - name: Attest binaries
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release-assets/sclaude_*
      - name: Reverify and publish draft
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          expected=(
            SHA256SUMS
            install.sh
            sclaude.spdx.json
            sclaude_darwin_amd64
            sclaude_darwin_arm64
            sclaude_linux_amd64
            sclaude_linux_arm64
          )
          test "$(gh release view "${tag}" --json isDraft --jq .isDraft)" = true || {
            echo "refusing to publish because the release is no longer a draft: ${tag}" >&2
            exit 1
          }
          remote_dir="${RUNNER_TEMP}/remote-release-final"
          mkdir -p "${remote_dir}"
          gh release download "${tag}" --dir "${remote_dir}"
          find "${remote_dir}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "${RUNNER_TEMP}/remote-assets-final.txt"
          diff -u "${RUNNER_TEMP}/expected-assets.txt" "${RUNNER_TEMP}/remote-assets-final.txt"
          (
            cd "${remote_dir}"
            sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > "${RUNNER_TEMP}/remote-assets-final.sha256"
          )
          cmp "${RUNNER_TEMP}/local-assets.sha256" "${RUNNER_TEMP}/remote-assets-final.sha256"
          gh release edit "${tag}" --draft=false
